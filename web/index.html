<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>pixel-desk</title>
  <link rel="stylesheet" href="assets/styles/tokens.css">
  <link rel="stylesheet" href="assets/styles/light.css">
  <link rel="stylesheet" href="desk.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="label" hidden>
    <div class="label-box">
      <div class="label-title"></div>
      <div class="label-hint"></div>
    </div>
    <div class="label-arrow"><i></i><i></i><i></i></div>
  </div>

  <header class="hud hud-top">
    <span class="hud-brand">@XELAND314 · PIXEL DESK</span>
    <span class="hud-date" id="date"></span>
  </header>
  <footer class="hud hud-bottom">
    <span><b>← →</b> MOVER</span>
    <span><b>ENTER</b> ABRIR</span>
    <span><b id="hint-direct">1-9</b> DIRECTO</span>
    <span><b>T</b> TEMA</span>
    <span id="hint-quit"><b>CTRL+Q</b> SALIR</span>
  </footer>

  <script type="module" src="desk.js"></script>
</body>
</html>
